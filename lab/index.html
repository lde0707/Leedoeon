<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB · 이도언</title>
<style>
  :root{
    --ink:#0d0e12; --paper:#f4f3f0; --sub:#8b8f98; --line:#23252b; --ac:#E8452C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink); color:#f2f2f0;
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}
  header{padding:90px 0 50px; border-bottom:1px solid var(--line);}
  .back{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--sub); text-decoration:none; letter-spacing:.06em; margin-bottom:34px;}
  .back:hover{color:var(--ac);}
  .back svg{width:13px; height:13px; transform:rotate(180deg);}
  h1{font-size:clamp(38px,7vw,64px); margin:0 0 16px; letter-spacing:-.03em; font-weight:800;}
  h1 span{color:var(--ac);}
  header p{color:var(--sub); font-size:15.5px; max-width:520px; margin:0;}

  main{padding:44px 0 100px;}
  .kicker{font-size:11px; letter-spacing:.2em; color:var(--sub); text-transform:uppercase; margin-bottom:22px;}

  .entry{
    display:flex; gap:24px; align-items:flex-start; justify-content:space-between;
    padding:28px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit;
    transition:.2s;
  }
  .entry:hover{padding-left:8px;}
  .entry:hover .title{color:var(--ac);}
  .entry:hover .arrow{transform:translate(4px,-4px); opacity:1;}
  .e-main{flex:1; min-width:0;}
  .e-top{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .tag{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ac); border:1px solid rgba(232,69,44,.4); background:rgba(232,69,44,.08); padding:3px 9px; border-radius:3px;}
  .date{font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .title{font-size:20px; font-weight:700; margin:0 0 6px; transition:.2s;}
  .desc{font-size:14px; color:var(--sub); max-width:560px;}
  .arrow{width:18px; height:18px; flex-shrink:0; margin-top:6px; opacity:.5; transition:.25s;}

  .empty-note{color:var(--sub); font-size:13px; padding:24px 0 0;}

  footer{padding:30px 0 60px; border-top:1px solid var(--line); font-size:11.5px; letter-spacing:.1em; color:#55585f; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
      PORTFOLIO
    </a>
    <h1>LAB<span>.</span></h1>
    <p>포트폴리오에 올리기 전, 트렌드 리서치·이벤트 기획·게임 시스템 아이디어를 정리해보는 작업 공간입니다. 완성된 프로젝트가 아니라 진행 중인 생각의 스케치들이에요.</p>
  </header>

  <main>
    <div class="kicker">ALL DOCS — 1</div>

    <a class="entry" href="ready-core-event-proposal.html" target="_blank" rel="noopener">
      <div class="e-main">
        <div class="e-top">
          <span class="tag">Event Proposal</span>
          <span class="date">2026.09.17</span>
        </div>
        <h3 class="title">레디코어 작전실</h3>
        <p class="desc">《트렌드 코리아 2026》의 '레디코어' 키워드를 이동 요새 디펜스 게임 커뮤니티 이벤트로 기획한 문서. 흑백 설계도 스타일.</p>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
    </a>

  </main>

  <footer>
    <span>© 2026 이도언</span>
    <span>LAB · WORK IN PROGRESS</span>
  </footer>
</div>
</body>
</html>
